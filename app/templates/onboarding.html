<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>初期設定 - 打鍵アクティビティ</title>
<style>
  body { font-family: "Segoe UI", sans-serif; margin: 2rem; background:#f7f7f8; color:#222; max-width: 560px; }
  h1 { font-size: 1.3rem; }
  p.desc { color: #555; }
  .box { background: white; padding: 1.2rem 1.5rem; border-radius: 8px; margin-top: 1rem; }
  label { display: block; margin: 0.8rem 0 0.3rem; font-size: 0.9rem; color: #333; }
  input[type=text] { width: 100%; padding: 0.4rem 0.5rem; font-size: 0.95rem; box-sizing: border-box; }
  .checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; }
  .checkbox-row input { width: auto; }
  button { margin-top: 1.2rem; padding: 0.5rem 1.2rem; font-size: 0.95rem; cursor: pointer; }
</style>
</head>
<body>
  <h1>打鍵アクティビティ - 初期設定</h1>
  <p class="desc">最初に、今使っているキーボードを登録してください。あとからいつでも追加・切替できます。</p>

  <form class="box" method="post" action="{{ url_for('onboarding') }}" id="onboarding-form">
    <label for="name-input">今使っているキーボードの名前</label>
    <input id="name-input" type="text" name="name" placeholder="例: 職場のキーボード">

    <div class="checkbox-row">
      <input type="checkbox" id="no-external" name="no_external">
      <label for="no-external" style="margin:0;">外部接続キーボードを使わない(ノートPC内蔵のみ)</label>
    </div>

    <button type="submit">これで始める</button>
  </form>

  <script>
    const checkbox = document.getElementById('no-external');
    const nameInput = document.getElementById('name-input');
    checkbox.addEventListener('change', () => {
      nameInput.disabled = checkbox.checked;
      nameInput.required = !checkbox.checked;
    });
    nameInput.required = true;
  </script>
</body>
</html>
